<section *ngIf="items?.length" class="row" [attr.aria-label]="title">
  <div class="row__head">
    <span *ngIf="eyebrow" class="flux-eyebrow">{{ eyebrow }}</span>
    <h2 class="row__title">{{ title }}</h2>
  </div>

  <div class="row__viewport">
    <button class="row__nav row__nav--prev" type="button" (click)="scroll(-1)" aria-label="Scroll left">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="row__track" #track>
      <flux-content-card *ngFor="let item of items; trackBy: trackById" [item]="item" (open)="open.emit($event)"></flux-content-card>
    </div>

    <button class="row__nav row__nav--next" type="button" (click)="scroll(1)" aria-label="Scroll right">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</section>
