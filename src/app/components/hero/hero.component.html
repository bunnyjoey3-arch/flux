<section class="hero" [style.--c1]="item.gradient[0]" [style.--c2]="item.gradient[1]">
  <img class="hero__poster" [src]="item.image || ('https://picsum.photos/seed/' + item.id + '/1200/600')" [attr.alt]="item.title" />
  <div class="hero__field" aria-hidden="true">
    <svg class="hero__wave" viewBox="0 0 1440 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--c1)" />
          <stop offset="100%" stop-color="var(--c2)" />
        </linearGradient>
      </defs>
      <path
        class="hero__wave-path hero__wave-path--a"
        d="M0,220 C 180,120 360,320 540,220 C 720,120 900,320 1080,220 C 1260,120 1350,220 1440,180"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="2"
      />
      <path
        class="hero__wave-path hero__wave-path--b"
        d="M0,260 C 200,180 380,340 560,260 C 740,180 920,340 1100,260 C 1280,180 1360,260 1440,230"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="1.5"
        opacity="0.5"
      />
    </svg>
    <div class="hero__scrim"></div>
  </div>

  <div class="hero__content flux-container">
    <span class="hero__eyebrow flux-eyebrow">
      Featured {{ item.category }}
    </span>
    <h1 class="hero__title">{{ item.title }}</h1>

    <div class="hero__meta">
      <span class="hero__match">{{ item.matchScore }}% match</span>
      <span>{{ item.year }}</span>
      <span class="flux-badge">{{ item.ageRating }}</span>
      <span>{{ item.duration }}</span>
    </div>

    <p class="hero__synopsis">{{ item.synopsis }}</p>

    <div class="hero__genres">
      @for (g of item.genres; track g) {
        <span class="flux-badge">{{ g }}</span>
      }
    </div>

    <div class="hero__actions">
      <button class="flux-btn flux-btn--primary" type="button" (click)="play.emit(item)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        Play
      </button>
      <button class="flux-btn flux-btn--ghost" type="button" (click)="moreInfo.emit(item)">
        More info
      </button>
    </div>
  </div>
</section>
