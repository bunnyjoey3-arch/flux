<header class="nav" [class.nav--scrolled]="scrolled">
  <div class="nav__inner flux-container">
    <a class="nav__logo" routerLink="/" aria-label="Flux home">
      <img class="nav__logo-img" src="assets/logo.png" alt="Flux logo" />
      <span class="visually-hidden">Flux</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: link.path === '/' }">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="nav__actions">
      <div class="nav__search" [class.nav__search--open]="searchOpen">
        <input
          type="search"
          placeholder="Search titles, genres, anime..."
          [(ngModel)]="query"
          (keyup.enter)="submitSearch()"
          aria-label="Search Flux catalog"
        />
        <button type="button" class="nav__icon-btn" (click)="searchOpen ? submitSearch() : toggleSearch()" aria-label="Search">
          <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="nav__avatar" aria-hidden="true">V</div>

      <button class="nav__icon-btn nav__menu-btn" type="button" (click)="menuOpen = !menuOpen" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  @if (menuOpen) {
    <nav class="nav__mobile" aria-label="Mobile">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" (click)="menuOpen = false">{{ link.label }}</a>
      }
    </nav>
  }
</header>
