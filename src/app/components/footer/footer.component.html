<footer class="footer">
  <div class="flux-container footer__inner">
    <div class="footer__top">
      <div class="footer__brand">
        <img class="footer__logo-img" src="assets/logo.svg" alt="Flux logo" />
        <p class="footer__tagline">Movies, series and anime — every genre, one current.</p>
      </div>

      <div class="footer__columns">
        @for (col of columns; track col.heading) {
          <div class="footer__col">
            <span class="footer__heading">{{ col.heading }}</span>
            @for (link of col.links; track link) {
              <a href="javascript:void(0)">{{ link }}</a>
            }
          </div>
        }
      </div>
    </div>

    <div class="footer__bottom">
      <span>&copy; {{ year }} Flux. A demo streaming interface \u2014 no real content is hosted here.</span>
    </div>
  </div>
</footer>
