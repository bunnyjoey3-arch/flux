<flux-hero *ngIf="featured" [item]="featured" (moreInfo)="openDetails($event)" (play)="openDetails($event)"></flux-hero>

<div class="home__rows">
  <flux-content-row
    eyebrow="On the current"
    title="Trending now"
    [items]="trending"
    (open)="openDetails($event)"
  ></flux-content-row>

  <flux-content-row
    eyebrow="Just landed"
    title="New releases"
    [items]="newReleases"
    (open)="openDetails($event)"
  ></flux-content-row>

  <flux-content-row
    eyebrow="Anime universe"
    title="Anime worth marathoning"
    [items]="anime"
    (open)="openDetails($event)"
  ></flux-content-row>

  <flux-content-row
    eyebrow="Feature length"
    title="Movies for tonight"
    [items]="movies"
    (open)="openDetails($event)"
  ></flux-content-row>

  <flux-content-row
    eyebrow="Season after season"
    title="Series to binge"
    [items]="series"
    (open)="openDetails($event)"
  ></flux-content-row>

  <flux-content-row
    eyebrow="Real stories"
    title="Documentaries"
    [items]="documentaries"
    (open)="openDetails($event)"
  ></flux-content-row>
</div>

<flux-content-modal *ngIf="activeItem" [item]="activeItem" (close)="closeDetails()" (openItem)="openDetails($event)"></flux-content-modal>
