<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Flux logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon: stylized F + screen -->
  <g transform="translate(40,20)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="120" rx="16" ry="16" fill="#0b0b0d"/>
    <path d="M26 30 L26 90 L66 90" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M90 32 L134 60 L90 88" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(240,120)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="64" fill="url(#g)">FLIX</text>
  </g>
</svg>
